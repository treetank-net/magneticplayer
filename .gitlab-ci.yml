stages:
  - mirror
  - release

# GitLab (treetank/magneticplayer) → GitHub (treetank-net/magneticplayer), jak w pozostałych projektach treetank.
# GITHUB_TREETANK_TOKEN: chroniona zmienna CI grupy treetank, więc job działa tylko na chronionych gałęziach i tagach
# (main jest chroniony; tagi wydań v* też trzeba chronić w ustawieniach projektu).
mirror-github:
  stage: mirror
  tags:
    - vps
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - |
      if [ -z "${GITHUB_TREETANK_TOKEN:-}" ]; then
        echo "Brak GITHUB_TREETANK_TOKEN: zmienna grupy treetank jest chroniona, a ta gałąź albo tag nie." >&2
        exit 1
      fi
      git remote remove gh 2>/dev/null || true
      git remote add gh "https://${GITHUB_TREETANK_TOKEN}@github.com/treetank-net/magneticplayer.git"
      if [ -n "${CI_COMMIT_BRANCH:-}" ]; then
        remote_sha="$(git ls-remote gh refs/heads/main | awk '{print $1}')"
        if [ "$remote_sha" != "$CI_COMMIT_SHA" ]; then
          git push --force gh "$CI_COMMIT_SHA:refs/heads/main"
        fi
      fi
      git push --tags gh

# Wydanie na chroniony tag v1.RRMMDD.GGMM (phone/tools/tag-release.sh): APK + podpisana paczka agenta na GitHubie.
# Klucze: chronione zmienne projektu ze środowiskiem „release” (MP_KEYSTORE_B64, MP_KEYSTORE_PASS, MP_KEY_PASS,
# MP_AGENT_KEY_B64), więc dostaje je tylko ten job. vps2 to też produkcja timeprotect: build z limitem (2 CPU, 5 GB).
release:
  stage: release
  tags:
    - vps2
  rules:
    - if: $CI_COMMIT_TAG =~ /^v1\.[0-9]{6}\.[0-9]{4}$/
  environment:
    name: release
  resource_group: magneticplayer-release
  timeout: 45m
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - phone/tools/release-ci.sh
