<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagneticPlayer</title>
<meta name="color-scheme" content="light dark">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --fg: #1b1d22; --muted: #646a75; --line: #e2e5ea;
  --accent: #3d5afe; --accent-fg: #fff; --ok: #2e9d5b; --warn: #c77700; --err: #c62828; --chip: #eef0f4;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121317; --card: #1c1e24; --fg: #e8e9ec; --muted: #9aa0ab; --line: #2c2f37;
          --accent: #8c9eff; --accent-fg: #0d1030; --ok: #5cc98a; --warn: #f0a640; --err: #ff6b6b; --chip: #262932; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
         display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; }
#status { font-size: 13px; color: var(--muted); }
#status.on { color: var(--ok); } #status.off { color: var(--err); }
nav { display: flex; gap: 4px; margin-left: auto; }
nav button { background: none; border: 0; color: var(--muted); padding: 8px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
nav button.active { background: var(--chip); color: var(--fg); font-weight: 600; }
main { max-width: 980px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); font-size: 13px; }
.name { font-weight: 600; overflow-wrap: anywhere; }
button, select, input { font: inherit; color: inherit; }
.btn { background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.big { font-size: 22px; padding: 10px 18px; min-width: 64px; }
.btn:disabled { opacity: .5; cursor: default; }
input[type=text], input[type=password], input[type=number], select { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
input[type=text] { width: 100%; }
.row > input[type=text] { flex: 1; width: auto; min-width: 0; }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin: 6px 0 2px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.ok > i { background: var(--ok); }
.list-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.dir { cursor: pointer; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.dir:hover { background: var(--chip); }
.crumbs { margin-bottom: 10px; }
.crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
.tag { display: inline-block; font-size: 12px; background: var(--chip); border-radius: 6px; padding: 1px 7px; margin-left: 6px; }
.ok { color: var(--ok); } .err { color: var(--err); } .warn { color: var(--warn); }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--fg); padding: 0; width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog .head { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); gap: 8px; }
dialog .head h2 { font-size: 16px; margin: 0; flex: 1; }
dialog .body { padding: 12px 16px; overflow: auto; max-height: calc(100vh - 140px); }
.sub { cursor: pointer; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.sub:hover { background: var(--chip); }
.prov { display: flex; gap: 8px; font-size: 13px; padding: 2px 0; }
.prov b { font-weight: 500; flex: 1; }
video { width: 100%; max-height: 70vh; background: #000; border-radius: 8px; }
#remote .controls { justify-content: center; margin: 14px 0; }
input[type=range] { width: 100%; accent-color: var(--accent); }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg);
         padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
#toast.show { opacity: 1; }
.kbd { font-family: ui-monospace, monospace; font-size: 12px; background: var(--chip); border-radius: 4px; padding: 0 5px; }
@media (max-width: 600px) { nav { margin-left: 0; width: 100%; } nav button { flex: 1; } main { padding: 12px; } }
/* server without a screen (config player: false): no "On the computer" and no mpv remote */
.noplayer .needs-player { display: none !important; }
.only-noplayer { display: none; }
.noplayer .only-noplayer { display: block; }
.guest .owner-only { display: none; }
</style>
</head>
<body>
<header>
  <h1>MagneticPlayer</h1>
  <span id="status">…</span>
  <button class="btn" id="btnSuspend" data-i18n-title="sleepTitle" data-i18n="sleep">Sleep</button>
  <button class="btn" id="btnScreen" data-i18n-title="screenTitle" data-i18n="screen">Screen</button>
  <nav>
    <button data-tab="torrents" class="active" data-i18n="tabTorrents">Downloading</button>
    <button data-tab="library" data-i18n="tabLibrary">Library</button>
    <button data-tab="remote" data-i18n="tabRemote">Remote</button>
  </nav>
</header>
<main>
  <section id="login" hidden class="card">
    <p class="name" data-i18n="loginTitle"></p>
    <p class="muted" data-i18n-html="loginHelp"></p>
    <div class="row"><input type="text" id="tokenInput" class="grow" data-i18n-placeholder="tokenPh" autocomplete="off"><button class="btn primary" id="tokenSave" data-i18n="connect"></button></div>
    <p class="name" style="margin-top:18px" data-i18n="reqTitle"></p>
    <p class="muted" data-i18n="reqHelp"></p>
    <div class="row"><input type="text" id="reqName" class="grow" data-i18n-placeholder="reqPh" maxlength="60" autocomplete="off"><button class="btn" id="reqSend" data-i18n="reqSend"></button></div>
    <p class="muted" id="reqState"></p>
  </section>
  <section id="torrents"></section>
  <section id="library" hidden></section>
  <section id="remote" hidden></section>
</main>
<dialog id="dlg"><div class="head"><h2 id="dlgTitle"></h2><button class="btn" id="dlgClose" data-i18n="close"></button></div><div class="body" id="dlgBody"></div></dialog>
<div id="toast"></div>

/** UI text in the current language. */
/** An error in plain words, the agent's `detail` folded, and "Try again" when `retry` is given. */
function errBox(e, retry) {
  return h("div", { class: "err" }, h("span", {}, e.message || String(e)), " ",
    e.detail ? h("details", { style: "display:inline" }, h("summary", { style: "display:inline;cursor:pointer" }, tr("details")),
      h("code", { style: "font-size:12px;overflow-wrap:anywhere" }, e.detail)) : null,
    retry ? h("button", { class: "btn", style: "margin-left:8px", onclick: retry }, tr("retry")) : null);
}
/** A fit result (download / subtitle list) in words. */
function fitWords(f) {
  if (!f || !f.verdict) return "";
  if (f.reason === "incomplete") return tr("fitIncomplete");
  return { good: f.weak ? tr("fitWeak") : tr("fitGood"), unsure: tr("fitUnsure"), bad: tr("fitBad"),

})();

// ---------------------------------------------------------------- Remote
const Remote = (() => {
  const root = $("#remote");
  let timer, st = null, dragging = false, built = false, els = {};
  const cmd = (c, value) => act(() => api("/api/player/cmd", value === undefined ? { cmd: c } : { cmd: c, value })).then(poll);
  function build() {
    const seek = h("input", { type: "range", min: 0, max: 1, step: 1, value: 0 });
    seek.addEventListener("input", () => { dragging = true; els.pos.textContent = clock(+seek.value); });
    seek.addEventListener("change", () => { dragging = false; cmd("seek_to", +seek.value); });
    const trackSel = type => {
      const s = h("select", { onchange: e => cmd("track", { type, id: e.target.value === "no" ? "no" : +e.target.value }) });
      return s;
    };
    els = { title: h("div", { class: "name", style: "font-size:17px" }), seek, pos: h("span"), dur: h("span"),
      play: h("button", { class: "btn big primary", onclick: () => cmd("toggle_pause") }, "⏯"),
      vol: h("span", { class: "muted" }), fs: h("button", { class: "btn", onclick: () => cmd("fullscreen") }, tr("fullscreen")),
      audio: trackSel("audio"), sub: trackSel("sub"), video: trackSel("video"), videoBox: h("label", { class: "muted" }),
      idle: h("div", { class: "card needs-player", hidden: true }, h("p", { class: "name" }, tr("idle")),
        h("p", { class: "muted" }, tr("idleHelp"))),
      idleNo: h("div", { class: "card only-noplayer" }, h("p", { class: "name" }, tr("noPlayer")),
        h("p", { class: "muted" }, tr("noPlayerHelp"))),
    };
    els.videoBox.append(tr("video"), els.video);
    els.panel = h("div", { class: "card" },
      els.title, h("div", { style: "margin-top:12px" }, seek),
      h("div", { class: "row muted" }, els.pos, h("span", { class: "grow" }), els.dur),
      h("div", { class: "row controls" },
        h("button", { class: "btn big", onclick: () => cmd("seek", -60), title: "-60 s" }, "⏪"),
        h("button", { class: "btn big", onclick: () => cmd("seek", -10), title: "-10 s" }, "↺10"),
        els.play,
        h("button", { class: "btn big", onclick: () => cmd("seek", 10), title: "+10 s" }, "10↻"),
        h("button", { class: "btn big", onclick: () => cmd("seek", 60), title: "+60 s" }, "⏩")),
      h("div", { class: "row controls" },
        h("button", { class: "btn", onclick: () => cmd("volume_rel", -5) }, tr("quieter")),
        h("button", { class: "btn", onclick: () => cmd("mute") }, "🔇"),
        h("button", { class: "btn", onclick: () => cmd("volume_rel", 5) }, tr("louder")), els.vol),
      h("div", { class: "row controls" }, els.fs, h("button", { class: "btn", onclick: () => cmd("stop") }, tr("stop"))),
      h("div", { class: "row", style: "justify-content:center;margin-top:6px" },
        h("label", { class: "muted" }, tr("audio"), els.audio), h("label", { class: "muted" }, tr("subs"), els.sub), els.videoBox),
      h("div", { class: "row", style: "justify-content:center;margin-top:10px" },
        h("button", { class: "btn", onclick: () => cmd("sub_delay", -0.1) }, tr("subDelay", "−0.1")),
        h("button", { class: "btn", onclick: () => cmd("sub_delay", 0.1) }, tr("subDelay", "+0.1")),
        h("button", { class: "btn", onclick: () => Subs.open({ playing: true, title: st?.title || "" }) }, tr("findSubs"))),
      h("p", { class: "muted", style: "text-align:center;margin:12px 0 0" },
        tr("keys"), h("span", { class: "kbd" }, tr("space")), tr("kPause"), h("span", { class: "kbd" }, "← →"), " 10 s · ",
        h("span", { class: "kbd" }, "↑ ↓"), tr("kVolume"), h("span", { class: "kbd" }, "f"), tr("kFullscreen"), h("span", { class: "kbd" }, "m"), tr("kMute")));
    const ccmd = (c, value) => act(() => api("/api/cast/cmd", value === undefined ? { cmd: c } : { cmd: c, value })).then(poll);
    els.cast = h("div", { class: "card", hidden: true });
    els.castTitle = h("div", { class: "name" }); els.castPos = h("p", { class: "muted" });
    els.castBar = h("div");
    els.castPlay = h("button", { class: "btn big primary", onclick: () => ccmd("toggle") }, "⏯");
    els.castVol = [h("button", { class: "btn", onclick: () => ccmd("volume", Math.max(0, (cst?.volume || 0) - 5)) }, "🔉"),
      h("button", { class: "btn", onclick: () => ccmd("volume", Math.min(100, (cst?.volume || 0) + 5)) }, "🔊")];
    put(els.cast, h("p", { class: "muted" }, "Chromecast"), els.castTitle, els.castBar, els.castPos,
      h("div", { class: "row controls" },
        h("button", { class: "btn big", onclick: () => ccmd("seek_rel", -10) }, "↺10"), els.castPlay,
        h("button", { class: "btn big", onclick: () => ccmd("seek_rel", 30) }, "30↻"),
        ...els.castVol,
        h("button", { class: "btn", onclick: () => ccmd("stop") }, tr("stop"))));
    els.panel.classList.add("needs-player");
    els.others = h("div", { class: "card", hidden: true });
    put(root, els.cast, els.idle, els.idleNo, els.panel, els.others);
    built = true;
  }
  const CODECS = { hdmv_pgs_subtitle: "PGS", dvd_subtitle: "VobSub", subrip: "SRT", ass: "ASS", eac3: "E-AC3", ac3: "AC3", aac: "AAC", dts: "DTS", truehd: "TrueHD", hevc: "HEVC", h264: "H.264", av1: "AV1" };
  function fillTracks(sel, type, tracks) {
    const list = tracks.filter(t => t.type === type);
    const opts = (type === "sub" ? [h("option", { value: "no" }, tr("off"))] : []).concat(list.map(t => {
      const name = [t.lang && t.lang.toUpperCase(), t.external ? (t.title || "").split("/").pop().slice(-24) : t.title,
        CODECS[t.codec] || t.codec, t["demux-channel-count"] ? t["demux-channel-count"] + "ch" : null, t.external ? tr("fromFile") : null].filter(Boolean).join(" · ");
      return h("option", { value: t.id }, name || tr("track", t.id));
    }));
    const sig = JSON.stringify(list.map(t => [t.id, t.title, t.lang]));
    if (sel._sig !== sig) { put(sel, ...opts); sel._sig = sig; }
    if (document.activeElement !== sel) { const s = list.find(t => t.selected); sel.value = s ? s.id : (type === "sub" ? "no" : sel.value); }
    return list.length;
  }
  let cst = null;
  async function poll() {
    try { st = await api("/api/player/status"); } catch (e) { st = null; }
    try { cst = await api("/api/cast/status"); } catch (e) { cst = null; }
    let ann = [];
    try { ann = await api("/api/announce"); } catch (e) { }
    if (!built) build();
    // what other remotes are playing (announcements from phones and other servers), without what's already shown above
    ann = ann.filter(x => !(x.target.kind === "cast" && cst?.active && x.target.name === cst.device));
    els.others.hidden = !ann.length;
    put(els.others, h("p", { class: "muted" }, tr("alsoPlaying")), ann.map(x => h("p", {},
      `${x.title || "?"} · ${x.target.name}`, h("span", { class: "muted" },
        ` · ${x.state === "PLAYING" ? tr("stPlaying") : tr("stPaused")} ${clock(x.pos || 0)}${x.dur ? " / " + clock(x.dur) : ""}` + tr("startedBy", x.from.name)))));
    els.cast.hidden = !cst?.active;
    if (cst?.active) {
      els.castTitle.textContent = (cst.title || "") + " · " + cst.device;
      put(els.castBar, cst.duration ? bar(cst.pos / cst.duration) : null);
      els.castPos.textContent = `${clock(cst.pos)} / ${clock(cst.duration || 0)} · ${cst.state} · ` +
        (cst.volume_fixed ? tr("volTv") : tr("vol", cst.volume));
      els.castVol.forEach(b => b.hidden = !!cst.volume_fixed);
      els.castPlay.textContent = cst.state === "PLAYING" ? "⏸" : "▶";
    }
    const running = st && st.running && !st.idle;
    els.idle.hidden = running; els.panel.hidden = !running;
    if (!running) return;
    els.title.textContent = st.title || "";
    const dur = st.duration || 0;
    els.seek.max = Math.max(1, Math.round(dur));
    if (!dragging) { els.seek.value = Math.round(st.pos || 0); els.pos.textContent = clock(st.pos); }
    els.dur.textContent = clock(dur);
    els.play.textContent = st.paused ? "▶" : "⏸";
    els.vol.textContent = `${Math.round(st.volume || 0)}%${st.muted ? tr("muted") : ""}`;
    els.fs.textContent = st.fullscreen ? tr("exitFullscreen") : tr("fullscreen");
    const tracks = st.tracks || [];
    fillTracks(els.audio, "audio", tracks); fillTracks(els.sub, "sub", tracks);
    els.videoBox.hidden = fillTracks(els.video, "video", tracks) < 2;
  }
  document.addEventListener("keydown", e => {
    if (tab !== "remote" || $("#dlg").open || /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName)) return;
    const k = { " ": ["toggle_pause"], ArrowLeft: ["seek", -10], ArrowRight: ["seek", 10], ArrowUp: ["volume_rel", 5], ArrowDown: ["volume_rel", -5], f: ["fullscreen"], m: ["mute"] }[e.key];
    if (k) { e.preventDefault(); cmd(...k); }
  });
  return { show() { clearInterval(timer); poll(); timer = setInterval(() => tab === "remote" && poll(), 1000); } };
})();

// ---------------------------------------------------------------- Subtitles
const Subs = (() => {
  let ctl = null;
  function open(ref) {
    ctl?.abort(); ctl = new AbortController();
    const signal = ctl.signal;
    const have = h("div", { class: "ok", style: "font-size:13px" });
    const status = h("div");
    const results = h("div");
    const title = h("input", { type: "text", placeholder: tr("titlePh") });
    const year = h("input", { type: "number", placeholder: tr("yearPh"), style: "width:90px", min: 1900, max: 2100 });
    const langs = h("input", { type: "text", value: subLangs(), style: "width:90px", title: tr("langsTitle") });
    const again = h("button", { class: "btn", onclick: () => run(title.value.trim() || null, +year.value || null) }, tr("searchTitle"));
    const fix = h("div", { class: "row", style: "margin-top:12px", hidden: true }, h("span", { class: "grow" }, title), year, langs, again);
    openDialog(tr("subsFor", ref.title || ref.path?.split("/").pop() || tr("whatsPlaying")),
      h("div", {}, have, status, results, fix), () => ctl?.abort());
    const listHave = () => api("/api/subs/list?" + refQuery(ref)).then(l => put(have, l.length ? tr("already", l.map(s => s.name.slice(-34)).join(", ")) : ""))
      .catch(e => put(have, errBox({ message: tr("subsListFailed", e.message), detail: e.detail }, listHave)));
    listHave();
    let override = [null, null];
    async function run(t, y) {
      override = [t, y];
      store.set("mp_sublangs", langs.value.trim() || "en,pl");
      put(results); fix.hidden = true;
      const body = { ...refBody(ref), languages: subLangs(), async: true };
      if (t) body.title = t; if (y) body.year = y;
      let job;
      try { job = (await api("/api/subs/search", body, { signal })).job; } catch (e) { return put(status, h("p", { class: "err" }, e.message)); }
      let stopping = false;
      while (!signal.aborted) {
        let p;
        try { p = await api("/api/subs/job?id=" + job, undefined, { signal }); } catch (e) { if (!signal.aborted) put(status, h("p", { class: "err" }, e.message)); return; }
        if (p.done) return finish(p);
        const phase = p.phase === "file" ? tr("phaseFile")
          : p.phase === "match" ? tr("phaseMatch", p.matched, p.total)
          : p.round === 2 ? tr("phaseRound2", p.query) : tr("phaseSearch", p.query || "…");
        const running = Object.values(p.providers || {}).some(v => v.state === "running" || v.state === "pending");
        put(status, 
          h("div", { class: "row" }, h("span", { class: "grow" }, "⏳ " + phase), h("span", { class: "muted" }, Math.round(p.elapsed) + " s")),
          p.phase === "match" && p.total ? bar(p.matched / p.total) : null,
          provRows(p.providers),
          p.phase === "search" && running ? h("button", { class: "btn", style: "margin-top:8px", disabled: stopping,
            onclick: e => { stopping = true; e.target.disabled = true; e.target.textContent = tr("stopping"); api("/api/subs/job/stop", { id: job }).catch(() => {}); } },
            tr("enough")) : null);
        await new Promise(r => setTimeout(r, 700));
      }
    }
    function finish(p) {
      const f = p.result;
      put(status, provRows(p.providers));
      fix.hidden = false;
      if (p.error) return put(results, h("p", { class: "err" }, p.error));
      if (!title.value) title.value = f.title || ""; if (!year.value && f.year) year.value = f.year;
      put(results, 
        f.hidden ? h("p", { class: "muted" }, tr("hidden", f.hidden)) : null,
        f.results.length ? null : h("p", {}, tr("nothing", f.query, subLangs())),
        f.results.map(r => {
          const note = h("div", { style: "font-size:13px" });
          const download = async () => {
            if (row._busy) return; row._busy = true; row.style.opacity = .6;
            const b = { ...refBody(ref), id: r.id, provider: r.provider, languages: subLangs(), fit: "wait", async: true };
            if (override[0]) b.title = override[0]; if (override[1]) b.year = override[1];
            try {  // a job: "downloading" → "fitting" → the result with the fit (agent 1.12.1+)
              const job = (await api("/api/subs/download", b)).job;
              let j;
              for (;;) {
                j = await api("/api/subs/job?id=" + job);
                if (j.done) break;
                put(note, h("span", { class: "muted" }, "⏳ " + (j.phase === "fit" ? tr("fitPhase") : tr("dlPhase"))));
                await new Promise(res => setTimeout(res, 700));
              }
              if (j.error) throw Object.assign(new Error(j.error), { detail: j.detail });
              const fw = fitWords(j.result.fit);
              put(note, h("span", { class: j.result.fit?.verdict === "bad" ? "err" : "ok" }, tr("downloaded", j.result.name) + (fw ? " · " + fw : "")));
              listHave();
            } catch (e) {
              put(note, errBox({ message: tr("dlFailed", e.message), detail: e.detail }, ev => { ev.stopPropagation(); download(); }));
            } finally { row._busy = false; row.style.opacity = 1; }
          };
          const row = h("div", { class: "sub", onclick: download },
            h("div", { class: "row" }, h("b", {}, r.lang.toUpperCase()), r.hash_match ? h("span", { class: "ok" }, tr("matches")) : null,
              h("span", { class: "grow" }), h("span", { class: "muted" }, PROVIDERS[r.provider] || r.provider)),
            h("div", { style: "font-size:13px;overflow-wrap:anywhere" }, r.release), r.hi ? h("div", { class: "muted" }, tr("hi")) : null, note);
          return row;
        }));
    }
    run(null, null);
  }
  function provRows(prov) {
    return h("div", { style: "margin-top:6px" }, Object.entries(prov || {}).map(([k, v]) => {
      const icon = { running: "⏳", done: "✔", error: "✖", skip: "–" }[v.state] || "…";
      const info = v.state === "running" ? tr("searching") : v.state === "done" ? tr("results", v.count || 0, Math.round(v.secs || 0)) : v.state === "pending" ? tr("waiting") : (v.error || v.state);
      return h("div", { class: "prov" }, h("span", { class: v.state === "done" ? "ok" : v.state === "error" ? "err" : "muted" }, icon), h("b", {}, PROVIDERS[k] || k),
        h("span", { class: v.state === "error" ? "err" : "muted" }, info));
    }));
  }
  const refBody = ref => ref.playing ? { playing: true } : ref.torrent_id ? { torrent_id: ref.torrent_id, file_index: ref.file_index } : { root: ref.root, path: ref.path };
  return { open };
})();

// ---------------------------------------------------------------- Player in the browser
const Player = (() => {
  async function open(ref) {
    const v = h("video", { controls: true, autoplay: true, preload: "auto", crossorigin: "anonymous" });
    v.src = mediaUrl(ref);
    let subs = [];
    const subsNote = h("span", { class: "muted" });
    async function loadSubs() {  // a failed list said nothing before: the film just played without subtitles
      try { subs = await api("/api/subs/list?" + refQuery(ref)); }
      catch (e) { put(subsNote, errBox({ message: tr("subsListFailed", e.message), detail: e.detail }, loadSubs)); return; }
      v.querySelectorAll("track").forEach(t => t.remove());
      const pref = subLangs().split(",");
      subs.sort((a, b) => (pref.indexOf(a.lang) + 1 || 99) - (pref.indexOf(b.lang) + 1 || 99));
      subs.forEach((s, i) => v.append(h("track", { kind: "subtitles", src: subUrl(ref, s.name, true), srclang: s.lang || "und", label: s.name.slice(-30), default: i === 0 })));
      put(subsNote, subs.length ? tr("subsCount", subs.length) : tr("noSubs"));
    }
    await loadSubs();
    const key = "mp_pos_" + (ref.torrent_id ? ref.torrent_id + "/" + ref.file_index : ref.root + "/" + ref.path);
    const saved = +store.get(key) || 0;
    v.addEventListener("loadedmetadata", () => { if (saved > 10 && saved < v.duration - 30) v.currentTime = saved; });
    let lastSave = 0;
    v.addEventListener("timeupdate", () => { if (Date.now() - lastSave > 5000) { lastSave = Date.now(); store.set(key, String(Math.floor(v.currentTime))); } });
    const err = h("p", { class: "err", hidden: true }, tr("cantPlay"));
    v.addEventListener("error", () => err.hidden = false);
    openDialog(ref.title || ref.path.split("/").pop(), h("div", {}, v, err,
      h("div", { class: "row", style: "margin-top:10px" },
        h("button", { class: "btn", onclick: () => { const t = v.currentTime; $("#dlg").close();
          act(async () => { await api("/api/player/open", { ...ref, start: t }); setTab("remote"); }, tr("playingFrom", clock(t))); } }, tr("toComputerHere")),
        subsNote)),
      () => { store.set(key, String(Math.floor(v.currentTime || 0))); v.pause(); v.removeAttribute("src"); v.load(); });
  }
  return { open };
})();

ping();
if (pairCode) pairWith(pairCode).then(() => setTab(tab), e => { toast(tr("pairing") + e.message); setTab(tab); });
else setTab(tab);
</script>
